name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Run unit tests
        run: pytest -q

      - name: Ansible syntax check
        run: ansible-playbook -i ansible/inventory.example.ini ansible/remediate_firewall.yml --syntax-check

      - name: Ansible lint
        run: ansible-lint ansible/remediate_firewall.yml
