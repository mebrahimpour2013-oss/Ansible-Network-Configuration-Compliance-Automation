[routers]
# Never commit real credentials. Use ansible-vault or a local untracked inventory.
# CHR example: SSH TCP 2222 forwarded to RouterOS TCP 22.
chr ansible_host=YOUR_PUBLIC_IP ansible_port=2222 ansible_user=YOUR_ROUTER_USER ansible_password=YOUR_ROUTER_PASSWORD ansible_connection=ansible.netcommon.network_cli ansible_network_os=community.routeros.routeros ansible_network_cli_ssh_type=libssh ansible_ssh_common_args='-o PreferredAuthentications=password -o PubkeyAuthentication=no'
